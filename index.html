 return shell("Orders",`<div class="card"><div class="tools"><input id="oq" type="search" placeholder="Search reference or customer" value="${esc(st.orderQ)}" aria-label="Search orders"><select id="os" aria-label="Filter status">${["All",...FLOW].map(f=>`<option ${f==st.oStatus?"selected":""}>${f}</option>`).join("")}</select></div><div class="tbl"><table><thead><tr><th>Ref</th><th>Customer</th><th>City</th><th>Qty</th><th>Total</th><th>Date</th><th>Status</th></tr></thead><tbody>${r.slice(pgr("orders",r.length)*PS,pgr("orders",r.length)*PS+PS).map(o=>`<tr><td><b>${o.ref}</b></td><td>${esc(o.name)}</td><td class="mut">${o.city}</td><td>${o.qty}</td><td>${inr(o.total)}</td><td class="mut">${o.date}</td><td><select data-o="${o.ref}" aria-label="Status for ${o.ref}" style="padding:6px 10px;width:auto">${FLOW.map(f=>`<option ${f==o.status?"selected":""}>${f}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan="7" class="mut">No orders found.</td></tr>`}</tbody></table></div>${pager("orders",r.length)}</div>`)}

function plan(){const s=st.simS||M[3].id,q=st.simQ||1,r=split(s,q),pd=paidOrd(),tf=pd.reduce((a,o)=>a+PLAN.fee*o.qty,0),sh=r.pay.slice(0,10),more=r.pay.slice(10),dp=PLAN.depth==Infinity?"u":String(PLAN.depth);
 return shell("Commission plan",`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><div class="kpi"><span>Company fee / bottle</span><b>${inr(PLAN.fee)}</b></div><div class="kpi"><span>Seller pool / bottle</span><b>${inr(PLAN.pool)}</b></div><div class="kpi"><span>Payout depth</span><b>${PLAN.depth==Infinity?"Unlimited":PLAN.depth}</b></div><div class="kpi"><span>Line length</span><b>${M.length}</b></div></div>
<div class="grid g2" style="margin-top:20px;align-items:start"><div class="card"><h3>Plan settings</h3><p class="mut" style="font-size:14px;margin-top:6px">The whole pool is always paid out. Each person gets a weight of d<sup>k</sup>, where k is how far they sit above the sale, then the pool is split in proportion. The closest person, who sponsored the seller, always earns more than anyone further up.</p><div class="row"><div><label for="pl">Pool per bottle</label><select id="pl">${[200,250,300].map(v=>`<option value="${v}" ${PLAN.pool==v*100?"selected":""}>₹${v}</option>`).join("")}</select></div><div><label for="dc">Decay d</label><select id="dc">${[[.4,"0.4 · steep, favours closest"],[.5,"0.5 · balanced"],[.6,"0.6 · flatter"]].map(([v,l])=>`<option value="${v}" ${PLAN.decay==v?"selected":""}>${l}</option>`).join("")}</select></div><div><label for="dp">Depth</label><select id="dp">${[["u","Unlimited"],["10","10 levels"],["5","5 levels"]].map(([v,l])=>`<option value="${v}" ${dp==v?"selected":""}>${l}</option>`).join("")}</select></div></div><button class="btn sec sm" data-a="grow" style="margin-top:16px">+ Add 10 members to the line</button></div>
<div class="card"><h3>Simulator</h3><div class="row"><div><label for="ss">Seller</label><select id="ss">${M.map(m=>`<option value="${m.id}" ${m.id==s?"selected":""}>${esc(m.name)} · ${m.id}</option>`).join("")}</select></div><div><label for="sq">Bottles</label><input id="sq" type="number" min="1" max="20" value="${q}"></div></div><div class="tbl" style="margin-top:12px"><table><thead><tr><th>Who</th><th>Role</th><th>Share</th><th>Earns</th></tr></thead><tbody>${sh.map(p=>`<tr><td>${esc(p.m.name)}</td><td>${p.lvl?"Upline "+p.lvl:"Seller"}</td><td class="mut">${p.pct.toFixed(1)}%</td><td><b>${inr(p.amt)}</b></td></tr>`).join("")}${more.length?`<tr><td class="mut" colspan="2">…and ${more.length} more further up</td><td class="mut">${more.reduce((a,p)=>a+p.pct,0).toFixed(2)}%</td><td>${inr(more.reduce((a,p)=>a+p.amt,0))}</td></tr>`:""}<tr><td><b>Company fee</b></td><td class="mut">Flat</td><td></td><td><b>${inr(r.fee)}</b></td></tr></tbody></table></div><p class="mut" style="font-size:13px;margin-top:10px">Company fees earned on paid orders: ${inr(tf)}</p></div></div>
<div class="card" style="margin-top:20px;border-color:var(--wr)"><h3>Compliance gate</h3><p class="mut" style="margin-top:8px">Demo logic only; payouts stay disabled. With unlimited depth, no cap, and the sponsor weighted highest, this plan is the form most likely to be challenged as a pyramid or money-circulation arrangement under the Direct Selling Rules, 2021, which bar paying for recruitment except as a result of sales. Keep payouts tied to real retail sales, make joining free with no purchase required, and get written counsel sign-off on depth, caps and reversals before any real money moves.</p></div>`)}
function product(){const v=[SCENE,`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#f6f1e4,#dfe8e3)"></div>${BOT}`,CAPS,`<div style="position:absolute;inset:0;background:var(--sf);padding:28px;display:grid;align-content:center;gap:6px"><b class="disp" style="font-size:26px">Supplement facts</b>${LABEL.map(([a,b])=>`<div class="ing"><span>${a}</span><span class="mut">${b}</span></div>`).join("")}</div>`];
 return `<div class="wrap" style="padding:40px 20px"><div class="grid g2" style="align-items:start"><div><div class="jar" style="aspect-ratio:1">${v[st.gi]}</div><div class="row" style="margin-top:12px;gap:8px">${["Scene","Bottle","Capsules","Label"].map((l,i)=>`<button class="btn ${i==st.gi?"":"sec"} sm" data-a="gal" data-i="${i}">${l}</button>`).join("")}</div></div><div><span class="chip ok">In stock · demo</span><h2 style="margin:14px 0 8px">Omega+ Omega-3 capsules</h2><div class="price disp" style="font-size:34px;font-weight:800">${inr(PRICE)}</div><p class="mut" style="margin:14px 0">One bottle, one price. Sample label values shown for the prototype; final label subject to approval.</p><ul class="mut" style="padding-left:18px"><li>Easy daily softgels</li><li>Guest checkout, no account needed</li><li>Pan-India delivery (areas to be confirmed)</li></ul><div class="row" style="margin-top:22px;gap:10px"><a class="btn lg" href="#checkout" style="flex:0 0 auto">Buy now</a><a class="btn sec lg" href="#earn" style="flex:0 0 auto">Sell Omega+</a></div></div></div></div>`}
function earnp(){const sel=M[M.length>5?5:M.length-1].id,r=split(sel,1);return `<div class="wrap" style="max-width:860px;padding:48px 20px"><span class="chip">For sellers</span><h1 style="font-size:clamp(34px,6vw,56px);margin:14px 0">${tr("How earnings work")}</h1><p class="mut" style="font-size:18px">Every bottle sold sets aside a seller pool. The whole pool is shared along the line above the sale, and the people closest to the sale earn the most.</p>
<div class="grid g3" style="margin:28px 0">${[["1","You sell","A customer buys a bottle through your link."],["2","The pool is set aside",inr(PLAN.pool)+" per bottle, after the flat company fee of "+inr(PLAN.fee)+"."],["3","The line shares it","Weights halve at every step up, so your sponsor earns more than theirs."]].map(a=>`<div class="card"><span class="chip">Step ${a[0]}</span><h3 style="margin:12px 0 6px">${a[1]}</h3><p class="mut">${a[2]}</p></div>`).join("")}</div>
<div class="card"><h3>Worked example: one bottle, seller ${esc(M.find(m=>m.id==sel).name)}</h3><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Person</th><th>Role</th><th>Earns</th></tr></thead><tbody>${r.pay.slice(0,8).map(p=>`<tr><td>${esc(p.m.name)}</td><td>${p.lvl?"Upline "+p.lvl:"Seller"}</td><td><b>${inr(p.amt)}</b></td></tr>`).join("")}</tbody></table></div></div>
<p class="mut" style="font-size:13px;margin-top:16px">Illustrative only. Earnings depend on real product sales, not on joining or enrolling anyone. Payouts are not live in this prototype.</p><div style="margin-top:20px"><a class="btn" href="#join">Join with a PIN</a></div></div>`}

const R={home,product,earn,checkout,confirm,login,join,account,
 admin:()=>st.user?.role=="admin"?admin():gate(),members:()=>st.user?.role=="admin"?members():gate(),pins:()=>st.user?.role=="admin"?pins():gate(),orders:()=>st.user?.role=="admin"?orders():gate(),plan:()=>st.user?.role=="admin"?plan():gate(),payouts:()=>st.user?.role=="admin"?payouts():gate(),payout};
function render(keep){const h=location.hash.slice(1)||"home";$("#v").innerHTML=(R[h]||home)()+(["home","product"].includes(h)?`<div class="sbar"><a class="btn" href="#checkout">${tr("Buy")} · ${inr(PRICE)}</a><a class="btn sec" target="_blank" rel="noopener" href="${wa("")}">WhatsApp</a></div>`:"");nav();if(!keep)window.scrollTo(0,0)}
addEventListener("hashchange",()=>{st.newPin=null;render()});
const go=h=>{location.hash=h};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="q+")st.qty=Math.min(20,st.qty+1);else if(a=="q-")st.qty=Math.max(1,st.qty-1);
 else if(a=="out"){st.user=null;return go("home")}
 else if(a=="as-m"){st.user={role:"member",name:"Ravi"};return go("account")}
 else if(a=="as-d"){st.user={role:"member",name:M[M.length-1].name};return go("account")}
 else if(a=="as-a"){st.user={role:"admin",name:"Admin"};return go("admin")}
 else if(a=="lang"){st.lang=st.lang=="hi"?"en":"hi"}else if(a=="pc"){st.pin=$("#pc").value.trim();st.pcm=/^[1-9]\d{5}$/.test(st.pin)?["ok","Delivery in 3–6 days · Cash on delivery available"]:["er","Enter a valid 6-digit pincode"]}else if(a=="pa"){PAYQ.find(x=>x.id==b.dataset.i).status=b.dataset.s}else if(a=="pg"){st.pg[b.dataset.k]=(st.pg[b.dataset.k]||0)+Number(b.dataset.d)}
 else if(a=="allup"){st.allUp=true}
 else if(a=="gal"){st.gi=Number(b.dataset.i)}
 else if(a=="grow"){const N=["Aarav","Diya","Vihaan","Anaya","Ishaan","Kavya","Reyansh","Myra","Arnav","Sara"];for(const n of N){const l=M[M.length-1],i=M.length;M.push({id:"M-"+(1001+i),name:n+i,email:n.toLowerCase()+i+"@example.com",parent:l.id,joined:"2026-11-2"+(i%10)})}}
 else if(a=="pin"){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=[...crypto.getRandomValues(new Uint8Array(10))].map(x=>A[x%32]).join("");st.newPin=r.slice(0,5)+"-"+r.slice(5);PINS.unshift({id:Date.now(),parent:$("#pp").value.split(" ")[0],code:"••••• •"+r.slice(6),exp:"2026-12-03",s:"Active"})}
 else if(a=="rev"){PINS.find(p=>p.id==b.dataset.i).s="Revoked"}
 const ids=["n","e","a","p","pc"],sv=ids.map(i=>$("#cf #"+i)?.value);render(true);ids.forEach((i,k)=>{const n=$("#cf #"+i);if(n&&sv[k])n.value=sv[k]})});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="mq"||t.id=="oq"){st[t.id=="mq"?"mQ":"orderQ"]=t.value;st.pg={};const p=t.selectionStart;render(true);const n=$("#"+t.id);n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{const t=e.target;if(t.id=="os"){st.oStatus=t.value;st.pg={};render(true)}else if(t.id=="mt"){payOf(st.user.name).type=t.value;render(true)}else if(["pl","dc","dp"].includes(t.id)){if(t.id=="pl")PLAN.pool=Number(t.value)*100;if(t.id=="dc")PLAN.decay=Number(t.value);if(t.id=="dp")PLAN.depth=t.value=="u"?Infinity:Number(t.value);render(true)}else if(t.id=="ss"||t.id=="sq"){st.simS=$("#ss").value;st.simQ=Math.min(20,Math.max(1,parseInt($("#sq").value)||1));render(true)}else if(t.dataset.o){ORD.find(o=>o.ref==t.dataset.o).status=t.value}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id,v=i=>($("#"+i).value||"").trim(),err=(id,m)=>{$("#"+id).innerHTML=`<div class="msg er" role="alert">${m}</div>`};
 if(f=="cf"){if(v("n").length<2)return err("cm","Enter your full name.");if(!/^\S+@\S+\.\S+$/.test(v("e")))return err("cm","Enter a valid email.");if(v("a").length<10)return err("cm","Enter a complete delivery address.");
  st.last={ref:"OM-"+(7009+Math.floor(Math.random()*900)),name:v("n"),qty:st.qty,total:st.qty*PRICE,status:"Request received"};go("confirm")}
 if(f=="wf"){const n=st.user.name,b=bal(n),amt=Math.round(Number(v("wa"))*100);if(!b.ok)return err("wm","You have already withdrawn this week.");if(!(amt>=10000))return err("wm","Minimum withdrawal is ₹100.");if(amt>b.avail)return err("wm","That is more than your available balance.");
  PAYQ.unshift({id:"PO-"+(2047+PAYQ.length),member:n,amt,to:payTo(n),date:isoD(TODAY),status:"Pending"});st.pmsg="Withdrawal of "+inr(amt)+" requested. It will be paid in the next weekly run (demo).";return render(true)}
 if(f=="pf"){const p=payOf(st.user.name);if(v("pn").length<2)return err("pm2","Enter the account holder name.");
  if(p.type=="UPI"){if(!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(v("pu")))return err("pm2","Enter a valid UPI ID, like name@bank.");p.upi=v("pu")}
  else{if(!/^\d{9,18}$/.test(v("pa")))return err("pm2","Account number must be 9 to 18 digits.");if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(v("pi").toUpperCase()))return err("pm2","Enter a valid IFSC, like HDFC0001234.");p.acc=v("pa");p.ifsc=v("pi").toUpperCase()}
  p.name=v("pn");st.pmsg="Payout details saved.";return render(true)}
 if(f=="lf"){if(!v("le")||!v("lp"))return err("lm","Enter email and password.");st.user={role:"member",name:"Ravi"};go("account")}
 if(f=="jf"){if(v("jn").length<2)return err("jm","Enter your name.");if(!/^\S+@\S+\.\S+$/.test(v("je")))return err("jm","Enter a valid email.");if(v("jp").length<8)return err("jm","Password needs 8+ characters.");
  const p=v("jc").toUpperCase().replace(/[^A-Z0-9]/g,"");if(p!="OMEGADEMO1")return err("jm","That PIN is not valid, expired or already used.");st.user={role:"member",name:"Ravi"};go("account")}});
render();
